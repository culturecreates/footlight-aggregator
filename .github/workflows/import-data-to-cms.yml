name: Import data to CMS

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      cms_referer_header:
        required: true
        type: string
      aggregator_username:
        required: true
        type: string
      source_url:
        required: true
        type: string
      footlight_base_url:
        required: true
        type: string
      footlight_calendar_id:
        required: true
        type: string
      batch_size:
        required: false
        type: number
        default: 5
      mapping_file_url:
        required: false
        type: string
      query_version:
        required: false
        type: string
        default: "V3"
      notify_artsdata_changes:
        required: true
        type: boolean
        default: false
      change_log_lookback_hours:
        required: false
        type: number
        default: 24
    secrets:
      aggregator_password:
        required: true
      datadog_token:
        required: true
      AWS_SES_ACCESS_KEY:
        required: true
      AWS_SES_SECRET_ACCESS_KEY:
        required: true
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: npm install
      - name: Make envfile
        run: |
          cat << EOF > .env
          DATA_DOG_CLIENT_TOKEN=${{ secrets.datadog_token }}
          ENABLING_LOG_TO_DATA_DOG=true
          CMS_REFERER_HEADER=${{ vars.CMS_REFERER_HEADER }}
          EOF
      - name: Build Footlight Aggregator
        run: npm run build
      - name: Import entities to footlight
        run: |
          node ./dist/main-commander.js  \
            import:entities -u ${{inputs.aggregator_username}} -p ${{secrets.aggregator_password}} \
            -s ${{inputs.source_url}} \
            -i ${{inputs.footlight_base_url}} \
            -c ${{inputs.footlight_calendar_id}} \
            -b ${{inputs.batch_size}} \
            -m ${{inputs.mapping_file_url}} \
            -q ${{inputs.query_version}}
      - name: Find start of Artsdata change window
        id: change-window
        if: ${{ inputs.notify_artsdata_changes }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          # Start from the last successful run of the calling workflow so no change is missed or repeated
          workflow_file=$(basename "${WORKFLOW_REF%%@*}")
          since=$(gh run list --repo "${{ github.repository }}" --workflow "$workflow_file" --status success \
            --limit 1 --json startedAt --jq '.[0].startedAt' || true)
          echo "since=${since}" >> "$GITHUB_OUTPUT"
      - name: Notify CMS about Artsdata changes
        if: ${{ inputs.notify_artsdata_changes }}
        continue-on-error: true
        env:
          SINCE: ${{ steps.change-window.outputs.since }}
        run: |
          window="--lookback-hours ${{ inputs.change_log_lookback_hours }}"
          if [ -n "$SINCE" ] && [ "$SINCE" != "null" ]; then window="--since $SINCE"; fi
          node ./dist/main-commander.js  \
            notify:artsdata-changes -u ${{inputs.aggregator_username}} -p ${{secrets.aggregator_password}} \
            -s ${{inputs.source_url}} \
            -i ${{inputs.footlight_base_url}} \
            -c ${{inputs.footlight_calendar_id}} \
            $window

  send-failure-notification:
    runs-on: ubuntu-latest
    needs: run
    if: failure()
    steps:
    - name: Send email via Amazon SES
      uses: aws-actions/configure-aws-credentials@v5
      with:
        aws-access-key-id: ${{ secrets.AWS_SES_ACCESS_KEY }}
        aws-secret-access-key: ${{ secrets.AWS_SES_SECRET_ACCESS_KEY }}
        aws-region: ca-central-1
    - name: Send email
      run: |
        aws ses send-email \
          --from ${{vars.FOOTLIGHT_INFO_EMAIL}} \
          --destination "ToAddresses=${{ vars.MEDIUM_ALERTS_EMAIL }}" \
          --message "Subject={Data='Medium Alert - ${{github.repository}} [${{github.workflow}}]'},Body={Text={Data='${{github.workflow}} in ${{github.repository}} failed.'}}"
